name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install pinned gdkit and gpm
        run: |
          go install github.com/cafecito-games/gdkit/cmd/gdkit@v0.10.0
          go install github.com/cafecito-games/godot-package-manager/cmd/gpm@v0.6.0

      - name: Install pinned Godot 4.7.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfontconfig1
          scripts/install-godot-linux-ci "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: gdkit format check .

      - name: Check lint rules
        run: gdkit lint check .

      - name: Check license headers
        run: gdkit license check .

      - name: Check uid:// sidecars
        run: gdkit uid check .

      - name: Install pinned addons
        run: gpm install --host-only

      - name: Run tests
        run: ./addons/gdtest/gdtest run --no-daemon --report-format junit --report-file report.xml

      - name: Verify the release package cuts cleanly
        run: scripts/verify-package 0.0.0

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdtest-report
          path: report.xml
