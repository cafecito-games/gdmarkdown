# gpm slice packaging manifest.
#
# This file is deliberately not at the repository root. gpm has no exclusion
# mechanism: every file under addon_path that no .gdextension key claims lands in
# the core slice. Keeping the manifest out of the root makes a bare
# `gpm package` fail loudly instead of publishing an unintended tree, and
# scripts/package-addon stages the shippable files before packaging them.
#
# gdmarkdown is pure GDScript, so it publishes a single mandatory core slice and
# no platform slices.

[package]
name       = "gdmarkdown"
addon_path = "addons/gdmarkdown"
# Always overridden by scripts/package-addon. For a release the version comes
# from the bump chosen in the Release workflow and is injected into both the
# index and the staged plugin.cfg, so a cut never depends on a committed file
# being current. A local cut falls back to the committed plugin.cfg value.
version    = "0.0.0"
