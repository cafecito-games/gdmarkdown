version: '3'

tasks:
  default:
    desc: Run the full verification gate
    deps: [lint, test]

  lint:
    desc: Check GDScript formatting, lint rules, license headers and uid:// sidecars
    cmds:
      - gdkit format check .
      - gdkit lint check .
      - gdkit license check .
      - gdkit uid check .

  format:
    desc: Rewrite GDScript sources in gdkit's canonical format
    cmds:
      - gdkit format write .

  uid:
    desc: Write missing uid:// sidecars
    cmds:
      - gdkit uid write .

  license:
    desc: Add or refresh the MIT license header in every GDScript file
    cmds:
      - gdkit license write .

  install:
    desc: Install pinned addons, including the gdtest runner
    cmds:
      - gpm install

  test:
    desc: Run the gdtest suite
    cmds:
      - ./addons/gdtest/gdtest run

  package:
    desc: Cut a gpm release archive into dist/
    cmds:
      - ./scripts/package-addon

  verify:package:
    desc: Cut and verify a release package without publishing it
    cmds:
      - ./scripts/verify-package {{.VERSION | default "0.0.0"}}

  bench:
    desc: Run the gdtest benchmarks
    cmds:
      - ./addons/gdtest/gdtest bench

  demo:
    desc: Run the interactive demo
    cmds:
      - godot --path .

  screenshots:
    desc: Regenerate the README screenshots in docs/images
    cmds:
      - ./scripts/capture-screenshots
