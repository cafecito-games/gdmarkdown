version: '3'

tasks:
  default:
    desc: Run the full verification gate
    deps: [lint, test]

  macos:
    desc: Build the macOS arm64 native GDExtension framework
    cmds:
      - ./scripts/build-native macos

  ios:
    desc: Build and sign the iOS device + simulator dynamic xcframework
    cmds:
      - ./scripts/build-native ios

  android:
    desc: Build the Android arm64, arm32, and x86_64 native libraries
    cmds:
      - ./scripts/build-native android {{.CLI_ARGS}}

  linux:
    desc: Build the Linux native GDExtension library
    cmds:
      - ./scripts/build-native linux {{.CLI_ARGS}}

  native:
    desc: Build all native targets supported by the current host
    cmds:
      - cmd: |
          case "$(uname -s)" in
            Darwin)
              ./scripts/build-native macos
              ./scripts/build-native ios
              ./scripts/build-native android
              ;;
            Linux)
              ./scripts/build-native linux
              ;;
            *)
              echo "Unsupported host OS: $(uname -s)" >&2
              exit 1
              ;;
          esac

  test:native:
    desc: Compile and run headless C++ unit tests
    cmds:
      - ./scripts/build-native test-native

  test:extension-load:
    desc: Load the addon in a throwaway Godot project and assert native classes register
    cmds:
      - ./scripts/test-gdextension-load

  test:gdscript:
    desc: Run the gdtest integration suite
    cmds:
      - ./addons/gdtest/gdtest run

  test:
    desc: Run native, extension-load, and GDScript test suites
    cmds:
      - task: test:native
      - task: test:extension-load
      - task: test:gdscript

  lint:
    desc: Check GDScript formatting, lint rules, license headers and uid:// sidecars
    cmds:
      - gdkit format check .
      - gdkit lint check .
      - gdkit license check --minimum-version 0.11.0 .
      - gdkit uid check .

  format:
    desc: Rewrite GDScript sources in gdkit's canonical format
    cmds:
      - gdkit format write .

  uid:
    desc: Write missing uid:// sidecars
    cmds:
      - gdkit uid write .

  license:
    desc: Add or refresh the MIT license header in every GDScript file
    cmds:
      - gdkit license write --minimum-version 0.11.0 .

  install:
    desc: Install pinned addons, including the gdtest runner
    cmds:
      - gpm install

  package:
    desc: Cut gpm platform slice archives into dist/
    cmds:
      - ./scripts/package-addon {{.CLI_ARGS}}

  verify:package:
    desc: Verify slice packaging contract and byte-for-byte reproducibility
    cmds:
      - ./scripts/verify-package {{.VERSION | default "0.0.0"}}

  vendor:
    desc: Sync the runtime gdmarkdown addon into a consumer project (DEST=/path/to/project)
    silent: true
    cmds:
      - cmd: |
          set -euo pipefail
          destination="{{.DEST}}"
          if [ -z "${destination}" ]; then
            echo "ERROR: DEST is required. Usage: task vendor DEST=/path/to/consumer-project" >&2
            exit 1
          fi
          staging_directory="$(mktemp -d)"
          trap 'rm -rf "${staging_directory}"' EXIT
          ./scripts/stage-addon-tree "${staging_directory}" >/dev/null
          mkdir -p "${destination}/addons/gdmarkdown"
          rsync -a --delete "${staging_directory}/addons/gdmarkdown/" "${destination}/addons/gdmarkdown/"
          echo "Vendored gdmarkdown into ${destination}/addons/gdmarkdown/"

  demo:
    desc: Run the interactive demo
    cmds:
      - godot --path .

  screenshots:
    desc: Regenerate the README screenshots in docs/images
    cmds:
      - ./scripts/capture-screenshots

  clean:
    desc: Remove native build outputs and dist archives
    cmds:
      - rm -rf
          addons/gdmarkdown/bin
          native/build
          native/.sconsign.dblite
          native/third_party/godot-cpp/bin
          native/third_party/godot-cpp/gen
          native/third_party/godot-cpp/.sconsign.dblite
          dist
